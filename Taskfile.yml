version: "3"

tasks:
  default:
    cmds:
      - task --list-all
    silent: true

  up:
    cmds:
      - docker compose up -d

  down:
    cmds:
      - docker compose down

  rebuild:
    cmds:
      - docker compose down
      - docker compose build --no-cache
      - docker compose up -d

  shell:
    cmds:
      - docker compose exec os-dev bash

  logs:
    cmds:
      - docker compose logs -f

  dev:
    cmds:
      - task: up
      - task: run:watch

  update-refs:
    cmds:
      - git submodule update --remote

  # ---------------------------
  # Lint
  # ---------------------------
  lint:
    desc: Run all lint checks
    cmds:
      - task lint:yaml
      - task lint:rust

  lint:yaml:
    cmds:
      - yamllint .

  lint:rust:
    cmds:
      - cargo fmt --all -- --check
      - task: clippy

  clippy:
    desc: Run cargo clippy
    cmds:
      - >-
        cargo +nightly clippy --target x86_64-unknown-uefi
        -Zbuild-std=core,compiler_builtins,alloc,panic_abort
        -Zbuild-std-features=compiler-builtins-mem -- -D warnings

  # ---------------------------
  # format
  # ---------------------------
  format:
    desc: Run all format checks
    cmds:
      - task format:yaml
      - task format:rust
  format:yaml:
    cmds:
      - yamllint -f parsable . | tee format.yaml
      - yamllint -f parsable . < format.yaml
  format:rust:
    cmds:
      - cargo fmt --all
      - task: clippy

  # ---------------------------
  # Test
  # ---------------------------
  test:
    desc: Run tests (note UEFIビルドではテスト不可)
    cmds:
      - echo "Note UEFI target does not support standard tests"
      - echo "Use 'task run' to test the bootloader in QEMU"

  test:coverage:
    desc: Run tests with coverage report using cargo-tarpaulin
    cmds:
      - cargo install cargo-tarpaulin --locked
      - cargo tarpaulin --workspace

  before-commit:
    cmds:
      - task lint
      # - task test # UEFI環境ではテスト不可

  # ---------------------------
  # Run
  # ---------------------------
  build:
    desc: Build for x86_64 UEFI target
    cmds:
      - >-
        cargo +nightly build --target x86_64-unknown-uefi
        -Zbuild-std=core,compiler_builtins,alloc,panic_abort
        -Zbuild-std-features=compiler-builtins-mem

  build:release:
    desc: Build release version for x86_64 UEFI target
    cmds:
      - >-
        cargo +nightly build --target x86_64-unknown-uefi --release
        -Zbuild-std=core,compiler_builtins,alloc,panic_abort
        -Zbuild-std-features=compiler-builtins-mem

  run:
    desc: Build and run in QEMU
    cmds:
      - task: build
      - >-
        cargo +nightly run --target x86_64-unknown-uefi
        -Zbuild-std=core,compiler_builtins,alloc,panic_abort
        -Zbuild-std-features=compiler-builtins-mem

  run:watch:
    cmds:
      - >-
        cargo watch -x "+nightly run --target x86_64-unknown-uefi
        -Zbuild-std=core,compiler_builtins,alloc,panic_abort
        -Zbuild-std-features=compiler-builtins-mem"

  run-docker:
    cmds:
      - >-
        docker compose exec -T os-dev cargo +nightly run
        --target x86_64-unknown-uefi
        -Zbuild-std=core,compiler_builtins,alloc,panic_abort
        -Zbuild-std-features=compiler-builtins-mem

  run-docker:watch:
    cmds:
      - >-
        docker compose exec -T os-dev cargo watch
        -x "+nightly run --target x86_64-unknown-uefi
        -Zbuild-std=core,compiler_builtins,alloc,panic_abort
        -Zbuild-std-features=compiler-builtins-mem"
